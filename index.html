<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>一品多商 - 智能商品匹配平台</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:#f0f2f5;color:#1f2937;min-height:100vh}
  .hero{background:linear-gradient(135deg,#6366f1 0%,#8b5cf6 50%,#a855f7 100%);color:#fff;padding:56px 24px 48px;text-align:center}
  .hero h1{font-size:36px;font-weight:700;margin-bottom:8px;letter-spacing:1px}
  .hero p{font-size:16px;opacity:.85;max-width:520px;margin:0 auto;line-height:1.7}
  .container{max-width:960px;margin:-32px auto 40px;padding:0 16px}
  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:20px}
  .card{background:#fff;border-radius:12px;padding:28px 24px;box-shadow:0 2px 12px rgba(0,0,0,.06);transition:transform .2s,box-shadow .2s;cursor:pointer;text-decoration:none;color:inherit;display:block}
  .card:hover{transform:translateY(-4px);box-shadow:0 8px 28px rgba(0,0,0,.1)}
  .card-icon{width:48px;height:48px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:24px;margin-bottom:16px}
  .card h2{font-size:18px;font-weight:600;margin-bottom:8px}
  .card p{font-size:13px;color:#6b7280;line-height:1.6}
  .card .badge{display:inline-block;margin-top:12px;padding:4px 12px;border-radius:20px;font-size:12px;font-weight:500}
  .c1 .card-icon{background:#eef2ff;color:#6366f1}
  .c1 .badge{background:#eef2ff;color:#6366f1}
  .c2 .card-icon{background:#fef3c7;color:#d97706}
  .c2 .badge{background:#fef3c7;color:#d97706}
  .c3 .card-icon{background:#d1fae5;color:#059669}
  .c3 .badge{background:#d1fae5;color:#059669}
  .footer{text-align:center;padding:24px;font-size:12px;color:#9ca3af}
</style>
</head>
<body>
  <div class="hero">
    <h1>一品多商</h1>
    <p>智能商品匹配平台 — 产品文档与原型汇总</p>
  </div>
  <div class="container">
    <div class="cards">
      <a class="card c1" href="版本快照/">
        <div class="card-icon">&#128247;</div>
        <h2>版本快照</h2>
        <p>V1 / V2 / V3 三个版本的页面截图与版本更新清单，记录产品演进历程。</p>
        <span class="badge">3 个版本</span>
      </a>
      <a class="card c2" href="产品方案文档/">
        <div class="card-icon">&#128196;</div>
        <h2>产品方案文档</h2>
        <p>包含全流程产品方案和技术产品方案文档，可在线下载查阅。</p>
        <span class="badge">2 份文档</span>
      </a>
      <a class="card c3" href="产品原型/">
        <div class="card-icon">&#127912;</div>
        <h2>产品原型</h2>
        <p>在线交互式原型演示，包括项目总览、数据准备、相似匹配、规则配置等完整功能模块。</p>
        <span class="badge">在线体验</span>
      </a>
    </div>
  </div>
  <div class="footer">一品多商 &copy; 2025</div>
</body>
</html>
