<!DOCTYPE html>
<html lang="zh-CN">
<head>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; font-size: 14px; background: #f4f4f4; color: #333; }

    /* Header */
    .header { background: #c0392b; position: sticky; top: 0; z-index: 100; }
    .header-top { display: flex; align-items: center; gap: 16px; padding: 10px 24px; max-width: 1200px; margin: 0 auto; }
    .logo-area { display: flex; align-items: center; gap: 10px; }
    .logo-icon { width: 36px; height: 36px; background: #fff; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 700; color: #c0392b; }
    .logo-text { color: #fff; font-size: 17px; font-weight: 700; }
    .logo-sub { color: rgba(255,255,255,0.7); font-size: 11px; margin-top: 1px; }
    .search-bar { flex: 1; display: flex; max-width: 580px; border-radius: 4px; overflow: hidden; }
    .search-bar select { padding: 0 10px; border: none; border-right: 1px solid #ddd; background: #fff; font-size: 13px; color: #333; cursor: pointer; min-width: 100px; }
    .search-bar input { flex: 1; padding: 9px 12px; border: none; font-size: 13px; outline: none; background: #fff; color: #333; }
    .search-btn { padding: 0 22px; background: #e74c3c; color: #fff; border: none; cursor: pointer; font-size: 14px; font-weight: 600; transition: background 0.15s; }
    .search-btn:hover { background: #a93226; }
    .header-actions { display: flex; gap: 20px; margin-left: auto; }
    .header-action { color: rgba(255,255,255,0.85); font-size: 12px; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 3px; }
    .header-action:hover { color: #fff; }
    .header-action svg { width: 20px; height: 20px; }

    .nav-bar { background: rgba(0,0,0,0.18); border-top: 1px solid rgba(255,255,255,0.12); }
    .nav-inner { max-width: 1200px; margin: 0 auto; padding: 0 24px; display: flex; }
    .nav-item { padding: 8px 16px; color: rgba(255,255,255,0.85); font-size: 13px; cursor: pointer; transition: background 0.15s; white-space: nowrap; }
    .nav-item:hover, .nav-item.active { background: rgba(255,255,255,0.15); color: #fff; }

    /* Main */
    .main { max-width: 1200px; margin: 0 auto; padding: 16px 24px; }

    .breadcrumb { display: flex; align-items: center; gap: 6px; font-size: 12px; color: #999; margin-bottom: 14px; }
    .breadcrumb a { color: #c0392b; cursor: pointer; }
    .breadcrumb a:hover { text-decoration: underline; }

    /* Filter */
    .filter-bar { background: #fff; border: 1px solid #e8e8e8; border-radius: 8px; padding: 14px 16px; margin-bottom: 14px; }
    .filter-row { display: flex; align-items: flex-start; gap: 12px; margin-bottom: 8px; }
    .filter-row:last-child { margin-bottom: 0; }
    .filter-label { font-size: 12px; color: #999; min-width: 56px; padding-top: 4px; }
    .filter-tags { display: flex; flex-wrap: wrap; gap: 6px; }
    .filter-tag { padding: 3px 12px; border-radius: 4px; border: 1px solid #e0e0e0; font-size: 12px; cursor: pointer; color: #666; transition: all 0.15s; background: #fafafa; }
    .filter-tag:hover { border-color: #c0392b; color: #c0392b; }
    .filter-tag.active { background: #c0392b; color: #fff; border-color: #c0392b; }

    /* Sort */
    .sort-bar { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; padding-bottom: 10px; border-bottom: 1px solid #eee; }
    .sort-label { font-size: 12px; color: #999; }
    .sort-btn { padding: 4px 12px; border-radius: 4px; border: 1px solid #e0e0e0; font-size: 12px; cursor: pointer; background: #fafafa; color: #666; transition: all 0.15s; }
    .sort-btn:hover, .sort-btn.active { background: #c0392b; color: #fff; border-color: #c0392b; }
    .result-count { margin-left: auto; font-size: 12px; color: #999; }

    /* Product Grid */
    .product-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px; }
    .product-card { background: #fff; border: 1px solid #e8e8e8; border-radius: 8px; overflow: hidden; cursor: pointer; transition: all 0.2s; position: relative; }
    .product-card:hover { border-color: #c0392b; box-shadow: 0 4px 16px rgba(192,57,43,0.14); transform: translateY(-2px); }
    .product-img { width: 100%; aspect-ratio: 1; background: #fff; display: flex; align-items: center; justify-content: center; position: relative; overflow: hidden; }
    .multi-badge { position: absolute; top: 7px; right: 7px; background: #c0392b; color: #fff; font-size: 10px; padding: 2px 6px; border-radius: 3px; font-weight: 700; }
    .product-info { padding: 10px 12px; }
    .product-name { font-size: 12px; color: #333; line-height: 1.45; height: 35px; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; margin-bottom: 6px; }
    .product-price { font-size: 18px; font-weight: 700; color: #c0392b; }
    .product-price-unit { font-size: 11px; font-weight: 400; color: #999; }
    .product-supplier { font-size: 11px; color: #999; margin-top: 4px; display: flex; align-items: center; gap: 4px; flex-wrap: wrap; }
    .zkh-badge { background: #1a6fc4; color: #fff; font-size: 9px; padding: 1px 4px; border-radius: 2px; font-weight: 700; }
    .best-tag { font-size: 10px; color: #c0392b; }

    /* Detail */
    .detail-page { display: none; }
    .detail-page.active { display: block; }
    .list-page.hidden { display: none; }
    .back-btn { display: inline-flex; align-items: center; gap: 6px; padding: 6px 14px; border: 1px solid #ddd; border-radius: 4px; background: #fff; color: #666; cursor: pointer; font-size: 13px; margin-bottom: 14px; transition: all 0.15s; }
    .back-btn:hover { border-color: #c0392b; color: #c0392b; }

    .detail-layout { display: grid; grid-template-columns: 420px 1fr; gap: 20px; margin-bottom: 20px; }
    .detail-img-box { background: #fff; border: 1px solid #e8e8e8; border-radius: 8px; overflow: hidden; }
    .detail-main-img { width: 100%; aspect-ratio: 1; display: flex; align-items: center; justify-content: center; font-size: 100px; background: #f9f9f9; }
    .detail-thumbs { display: flex; gap: 8px; padding: 10px; border-top: 1px solid #eee; }
    .thumb { width: 58px; height: 58px; border: 2px solid transparent; border-radius: 4px; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 22px; background: #f5f5f5; }
    .thumb.active { border-color: #c0392b; }

    .detail-info { background: #fff; border: 1px solid #e8e8e8; border-radius: 8px; padding: 20px; }
    .detail-title { font-size: 15px; font-weight: 600; line-height: 1.55; margin-bottom: 14px; }
    .price-box { background: #fff9f8; border: 1px solid #fde0dd; border-radius: 6px; padding: 14px 16px; margin-bottom: 16px; }
    .price-label { font-size: 11px; color: #999; margin-bottom: 4px; }
    .price-main { font-size: 30px; font-weight: 700; color: #c0392b; }
    .price-unit { font-size: 13px; color: #999; font-weight: 400; }
    .price-saving { font-size: 11px; color: #27ae60; margin-top: 4px; }

    .attr-row { display: flex; padding: 8px 0; border-bottom: 1px solid #f0f0f0; font-size: 13px; }
    .attr-row:last-child { border-bottom: none; }
    .attr-key { min-width: 80px; color: #999; }
    .attr-val { color: #333; flex: 1; }
    .spec-tag { display: inline-block; padding: 2px 10px; border: 1px solid #e0e0e0; border-radius: 4px; cursor: pointer; margin-right: 6px; margin-bottom: 4px; font-size: 12px; }
    .spec-tag.active { border-color: #c0392b; color: #c0392b; background: #fff8f7; }
    .qty-input { width: 72px; padding: 5px 8px; border: 1px solid #e0e0e0; border-radius: 4px; font-size: 13px; }

    .detail-actions { display: flex; gap: 10px; margin: 16px 0; }
    .btn-cart { flex: 1; padding: 12px; background: #c0392b; color: #fff; border: none; border-radius: 6px; font-size: 15px; font-weight: 600; cursor: pointer; transition: background 0.15s; }
    .btn-cart:hover { background: #a93226; }
    .btn-fav { padding: 12px 20px; border: 1px solid #ddd; border-radius: 6px; background: #fff; color: #666; cursor: pointer; font-size: 13px; }
    .btn-fav:hover { border-color: #c0392b; color: #c0392b; }
    .guarantees { display: flex; gap: 20px; font-size: 12px; color: #999; }

    .multi-section { background: #fff; border: 1px solid #e8e8e8; border-radius: 8px; padding: 18px; margin-bottom: 18px; }
    .multi-title { font-size: 15px; font-weight: 700; margin-bottom: 14px; display: flex; align-items: center; gap: 8px; }
    .multi-sub { font-size: 12px; color: #999; font-weight: 400; }

    table { width: 100%; border-collapse: collapse; }
    thead th { font-size: 11px; color: #999; text-transform: uppercase; letter-spacing: 0.5px; padding: 8px 12px; text-align: left; border-bottom: 2px solid #f0f0f0; background: #fafafa; }
    tbody td { padding: 12px; border-bottom: 1px solid #f5f5f5; font-size: 13px; vertical-align: middle; }
    tbody tr:last-child td { border-bottom: none; }
    tbody tr:hover td { background: #fafafa; }
    tbody tr.best-row td { background: #fff9f8; }

    .s-name { font-weight: 500; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
    .tag { font-size: 9px; padding: 2px 5px; border-radius: 2px; font-weight: 700; color: #fff; }
    .tag-zkh { background: #1a6fc4; }
    .tag-best { background: #c0392b; }
    .tag-mfr { background: #27ae60; }
    .s-price { font-size: 17px; font-weight: 700; color: #c0392b; }
    .s-price.norm { color: #333; }
    .s-unit { font-size: 11px; color: #999; }
    .s-delivery { font-size: 12px; color: #666; }
    .s-stock.in { color: #27ae60; font-size: 12px; }
    .s-stock.low { color: #f39c12; font-size: 12px; }
    .btn-buy { padding: 6px 16px; background: #c0392b; color: #fff; border: none; border-radius: 4px; font-size: 12px; cursor: pointer; font-weight: 500; }
    .btn-buy:hover { background: #a93226; }
    .btn-detail { padding: 6px 14px; border: 1px solid #ddd; border-radius: 4px; font-size: 12px; cursor: pointer; background: #fff; color: #666; margin-left: 6px; }

    .related-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; }

    /* Toast */
    .toast { position: fixed; bottom: 28px; right: 28px; background: #27ae60; color: #fff; padding: 11px 20px; border-radius: 6px; font-size: 13px; font-weight: 500; opacity: 0; transform: translateY(8px); transition: all 0.3s; pointer-events: none; z-index: 9999; }

  </style>
</head>

let currentCat = 'all', currentKeyword = '', currentSort = 'default';

function getFiltered() {
  let list = [...products];
  if (currentCat !== 'all') list = list.filter(p => p.cat === currentCat);
  if (currentKeyword) list = list.filter(p => p.name.includes(currentKeyword) || p.cat.includes(currentKeyword));
  if (currentSort === 'price') list.sort((a,b) => a.suppliers[0].price - b.suppliers[0].price);
  return list;
}

function renderList() {
  const list = getFiltered();
  document.getElementById('resultCount').innerHTML = `共 <strong>${list.length}</strong> 件商品`;
  document.getElementById('productGrid').innerHTML = list.map(p => {
    const best = p.suppliers[0];
    const isZKH = best.tags.includes('ZKH');
    return `<div class="product-card" onclick="showDetail(${p.id})">
      <div class="product-img">
        <img src="${p.img}" alt="${p.name}" style="width:100%;height:100%;object-fit:cover;">
        ${p.suppliers.length > 1 ? `<span class="multi-badge">一品${p.suppliers.length}商</span>` : ''}
      </div>
      <div class="product-info">
        <div class="product-name">${p.name}</div>
        <div class="product-price">¥${best.price.toFixed(2)}<span class="product-price-unit">/${p.unit}</span></div>
        <div class="product-supplier">
          ${isZKH ? '<span class="zkh-badge">ZKH</span>' : ''}
          <span>${best.name}</span>
          ${best.tags.includes('最优价') ? '<span class="best-tag">最优价</span>' : ''}
        </div>
      </div>
    </div>`;
  }).join('');
}

function doSearch() {
  currentKeyword = document.getElementById('searchInput').value.trim();
  currentCat = document.getElementById('catSelect').value;
  document.getElementById('bcCat').textContent = currentCat === 'all' ? '全部商品' : currentCat;
  document.getElementById('bcSearchWrap').style.display = currentKeyword ? '' : 'none';
  document.getElementById('bcKeyword').textContent = currentKeyword;
  syncFilterTags(currentCat);
  renderList();
  showListPage();
}

function filterByNav(cat, el) {
  currentCat = cat; currentKeyword = '';
  document.getElementById('searchInput').value = '';
  document.getElementById('catSelect').value = cat;
  document.getElementById('bcCat').textContent = cat === 'all' ? '全部商品' : cat;
  document.getElementById('bcSearchWrap').style.display = 'none';
  document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
  if (el) el.classList.add('active');
  syncFilterTags(cat);
  renderList();
  showListPage();
}

function filterByCategory(cat) {
  currentCat = cat;
  document.getElementById('bcCat').textContent = cat === 'all' ? '全部商品' : cat;
  syncFilterTags(cat);
  renderList();
}

function setFilterTag(el, cat) {
  currentCat = cat;
  document.getElementById('bcCat').textContent = cat === 'all' ? '全部商品' : cat;
  syncFilterTags(cat);
  renderList();
}

function syncFilterTags(cat) {
  const label = cat === 'all' ? '全部' : cat;
  document.querySelectorAll('#catTags .filter-tag').forEach(t => {
    t.classList.toggle('active', t.textContent.trim() === label);
  });
}

function setSortBtn(el, sort) {
  currentSort = sort;
  document.querySelectorAll('.sort-btn').forEach(b => b.classList.remove('active'));
  el.classList.add('active');
  renderList();
}

function showDetail(id) {
  const p = products.find(x => x.id === id);
  if (!p) return;
  const best = p.suppliers[0];
  const worst = p.suppliers[p.suppliers.length - 1];
  const saving = (worst.price - best.price).toFixed(2);
  const related = products.filter(x => x.cat === p.cat && x.id !== p.id).slice(0, 5);

  document.getElementById('detailContent').innerHTML = `
    <div class="breadcrumb">
      <a onclick="filterByNav('all',null)">首页</a><span>›</span>
      <a onclick="filterByNav('${p.cat}',null)">${p.cat}</a><span>›</span>
      <span>${p.name.substring(0,24)}…</span>
    </div>
    <div class="detail-layout">
      <div class="detail-img-box">
        <div class="detail-main-img"><img src="${p.img}" alt="${p.name}" style="width:100%;height:100%;object-fit:contain;padding:16px;"></div>
        <div class="detail-thumbs">
          ${[0,1,2,3].map(i=>`<div class="thumb ${i===0?'active':''}"><img src="${p.img}" alt="" style="width:100%;height:100%;object-fit:cover;border-radius:2px;"></div>`).join('')}
        </div>
      </div>
      <div class="detail-info">
        <div class="detail-title">${p.name}</div>
        <div class="price-box">
          <div class="price-label">最低采购价（${best.name}）</div>
          <div><span class="price-main">¥${best.price.toFixed(2)}</span><span class="price-unit"> / ${p.unit}</span></div>
          ${p.suppliers.length > 1 && parseFloat(saving) > 0 ? `<div class="price-saving">✓ 一品多商比价，较最高报价节省 ¥${saving}/${p.unit}</div>` : ''}
        </div>
        <div>
          <div class="attr-row"><span class="attr-key">所属类目</span><span class="attr-val">${p.cat}</span></div>
          <div class="attr-row"><span class="attr-key">最快货期</span><span class="attr-val">${best.delivery}（${best.name}）</span></div>
          <div class="attr-row"><span class="attr-key">供应商数</span><span class="attr-val">${p.suppliers.length} 家平台供应商可报价</span></div>
          <div class="attr-row"><span class="attr-key">采购规格</span><span class="attr-val">
            <span class="spec-tag active" onclick="selectSpec(this)">标准件</span>
            <span class="spec-tag" onclick="selectSpec(this)">批量采购</span>
            <span class="spec-tag" onclick="selectSpec(this)">定制规格</span>
          </span></div>
          <div class="attr-row"><span class="attr-key">采购数量</span><span class="attr-val">
            <input class="qty-input" type="number" min="1" value="1">
            <span style="font-size:12px;color:#999;margin-left:8px">最小起订 1 ${p.unit}</span>
          </span></div>
        </div>
        <div class="detail-actions">
          <button class="btn-cart" onclick="addCart('${p.name.replace(/'/g,'').substring(0,20)}')">加入采购单</button>
          <button class="btn-fav">♡ 收藏</button>
        </div>
        <div class="guarantees">
          <span>✓ 企业开票</span>
          <span>✓ 正品保障</span>
          <span>✓ 7天退换</span>
          <span>✓ 专属客服</span>
        </div>
      </div>
    </div>

    <div class="multi-section">
      <div class="multi-title">
        🏪 一品多商 · 全网比价
        <span class="multi-sub">共 ${p.suppliers.length} 家供应商，平台为您智能比价</span>
      </div>
      <table>
        <thead>
          <tr>
            <th>供应商</th>
            <th>单价</th>
            <th>货期</th>
            <th>库存状态</th>
            <th>操作</th>
          </tr>
        </thead>
        <tbody>
          ${p.suppliers.map((s,i) => `
            <tr class="${i===0&&s.tags.includes('最优价')?'best-row':''}">
              <td><div class="s-name">
                ${s.name}
                ${s.tags.includes('ZKH')?'<span class="tag tag-zkh">ZKH</span>':''}
                ${s.tags.includes('最优价')?'<span class="tag tag-best">最优价</span>':''}
                ${s.tags.includes('制造商')?'<span class="tag tag-mfr">制造商</span>':''}
              </div></td>
              <td><span class="${i===0&&s.tags.includes('最优价')?'s-price':'s-price norm'}">¥${s.price.toFixed(2)}</span><span class="s-unit">/${p.unit}</span></td>
              <td><span class="s-delivery">${s.delivery}</span></td>
              <td><span class="s-stock ${s.stock}">${s.stockText}</span></td>
              <td>
                <button class="btn-buy" onclick="window.open('${s.detailUrl}','_blank')">立即采购</button>
                <button class="btn-detail" onclick="window.open('${s.detailUrl}','_blank')">查看详情</button>
              </td>
            </tr>
          `).join('')}
        </tbody>
      </table>
    </div>

    ${related.length > 0 ? `
    <div class="related-section">
      <div class="related-title">同类商品推荐</div>
      <div class="related-grid">
        ${related.map(r => `
          <div class="product-card" onclick="showDetail(${r.id})">
            <div class="product-img">
              <img src="${r.img}" alt="${r.name}" style="width:100%;height:100%;object-fit:cover;">
              ${r.suppliers.length>1?`<span class="multi-badge">一品${r.suppliers.length}商</span>`:''}
            </div>
            <div class="product-info">
              <div class="product-name">${r.name}</div>
              <div class="product-price" style="font-size:15px">¥${r.suppliers[0].price.toFixed(2)}<span class="product-price-unit">/${r.unit}</span></div>
            </div>
          </div>
        `).join('')}
      </div>
    </div>` : ''}
  `;

  document.getElementById('listPage').classList.add('hidden');
  document.getElementById('detailPage').classList.add('active');
  window.scrollTo(0, 0);
}

function selectSpec(el) {
  el.closest('.attr-val').querySelectorAll('.spec-tag').forEach(t => t.classList.remove('active'));
  el.classList.add('active');
}

function goBack() {
  document.getElementById('listPage').classList.remove('hidden');
  document.getElementById('detailPage').classList.remove('active');
}

function showListPage() {
  document.getElementById('listPage').classList.remove('hidden');
  document.getElementById('detailPage').classList.remove('active');
}

function addCart(name) {
  const t = document.getElementById('toast');
  t.textContent = `✓ 已加入采购单：${name}`;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

renderList();
